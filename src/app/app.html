<!-- {{title}}    #one way binding  only send the component to html -->

<h1>{{title}}</h1>
<input type="text"[(ngModel)]="title"/> <!--  #two way binding send and receive data from component to html and html to component -->

<h1>{{getTitle()}}</h1>    <!--  # string with function  -->

<img [src]="imageUrl"/>  <!-- # property binding -->
<h1 [innerText]="title"></h1>

<p [textContent]="user?.name"></p> <!-- # safe navigation operator -->


<h1>clicked {{clickcount}} times</h1>
<button (click)="clickme()">click</button> <!-- # event binding -->



<router-outlet></router-outlet>
